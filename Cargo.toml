[package]
name = "ferrolink"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Fast, parallel link checker for static HTML builds: cross-page links, anchors, and assets."
authors = ["Sebastian Software GmbH"]
license = "Apache-2.0"
repository = "https://github.com/sebastian-software/ferrolink"
homepage = "https://github.com/sebastian-software/ferrolink"
documentation = "https://docs.rs/ferrolink"
readme = "README.md"
keywords = ["html", "links", "static-site", "checker", "ferramenta"]
categories = ["command-line-utilities", "development-tools", "web-programming"]
exclude = [".github/", "docs/"]

[features]
# The alternative HTML backends behind `--parser`, kept to reproduce the
# comparison in docs/parsers.md. The default build ships html5gum only.
parser-comparison = ["dep:ferroni", "dep:html5ever", "dep:lol_html"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ferralk = "1.1.0"
ferroni = { version = "2.3.0", optional = true }
html5ever = { version = "0.40.1", optional = true }
html5gum = "0.8.4"
lol_html = { version = "3.0.1", optional = true }
memchr = "2.8.3"
percent-encoding = "2.3.2"
rayon = "1.12.0"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"

[[example]]
name = "compare_parsers"
required-features = ["parser-comparison"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }
