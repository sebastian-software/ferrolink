[package]
name = "ferrolink"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Fast, parallel link checker for static HTML builds: cross-page links, anchors, and assets."
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/sebastian-software/ferrolink"
documentation = "https://docs.rs/ferrolink"
readme = "README.md"
keywords = ["html", "links", "static-site", "checker", "ferramenta"]
categories = ["command-line-utilities", "development-tools", "web-programming"]
exclude = [".github/", "docs/", "node/"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ferralk = "1.1.0"
ferroni = "2.5.2"
memchr = "2.8.3"
percent-encoding = "2.3.2"
rayon = "1.12.0"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

# The npm package's native binding lives in `node/native`. Release Please's
# `rust` strategy moves every listed member to the product version, so the
# member keeps a concrete `version` rather than inheriting one.
[workspace]
members = ["node/native"]

[workspace.package]
edition = "2024"
rust-version = "1.96"
authors = ["Sebastian Software GmbH"]
license = "Apache-2.0"
repository = "https://github.com/sebastian-software/ferrolink"

[workspace.lints.rust]
# `deny` rather than `forbid`: the napi-derive expansions in `node/native`
# allow unsafe code locally, which `forbid` rejects. No hand-written code
# needs it.
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }
