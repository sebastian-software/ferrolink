[package]
name = "ferrolink-node"
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
description = "Node.js binding of ferrolink, published to npm as `ferrolink`."
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
ferrolink = { version = "0.2.1", path = "../.." }
napi = "3.15.0"
napi-derive = "3.6.13"

[build-dependencies]
napi-build = "2.6.0"

[lints]
workspace = true
