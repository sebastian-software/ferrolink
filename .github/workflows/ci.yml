name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  pr-title:
    name: conventional pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      # The default build ships html5gum only; `parser-comparison` adds the
      # other backends. Both feature sets must stay warning-free.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --all-features --locked

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
      # `rust-version` in Cargo.toml is the single source of truth for the MSRV.
      # A README badge, justfile or docs page that restates the number is a copy
      # and must be derived from this one, never edited independently.
      # `cargo metadata` resolves `rust-version.workspace = true` and does not
      # care how the manifest is quoted or indented, which a regex would.
      - name: Read the declared MSRV
        id: msrv
        shell: bash
        run: |
          mapfile -t versions < <(
            cargo metadata --no-deps --format-version 1 |
              jq -r '[.packages[].rust_version | select(. != null)] | unique | .[]'
          )
          if [ "${#versions[@]}" -ne 1 ]; then
            echo "::error::expected exactly one rust-version across the workspace, found ${#versions[@]}: ${versions[*]}"
            exit 1
          fi
          echo "version=${versions[0]}" >> "$GITHUB_OUTPUT"
          echo "Declared MSRV is ${versions[0]}"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master branch
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      # The action only sets the rustup default, and `rust-toolchain.toml`
      # outranks that; a directory override outranks the file. Without this
      # line the lane would quietly check with whatever the file selects.
      - run: rustup override set "$MSRV"
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Benches and tests are checked too, so a bench-only MSRV regression
      # cannot hide behind a green build.
      - run: cargo check --workspace --all-targets --all-features --locked

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans licenses sources

  standards:
    name: Standards / Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Guard: agent step not yet completed for this PR"
        run: test ! -f .standards/pending.json

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          # This repository has no root package.json to read `packageManager`
          # from, so the pnpm version is spelled out here, as in Ferroni.
          version: 12.11.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # The marker guard needs `node`, so it sits below the toolchain setup
      # rather than beside the pending guard it complements.
      # `.standards/blocked.json` records an agent run that pushed a result it
      # could not validate. `blocking: true` is the alignment class, with two
      # members: the pinned CLI does not ship the stamped manifest version, or
      # the pin is not an exact version literal. Either way `standards check`
      # exits 3 and the pull request must not merge (only the stamp member also
      # makes `apply` and `sync` refuse to write). A non-blocking marker is
      # context for the reviewer — the failures it lists are reported by this
      # workflow's own lanes. The marker is parsed rather than matched line by
      # line: JSON may put `"blocking":` and `true` on separate lines, and a guard
      # whose whole purpose is to fail closed must fail on a marker it cannot
      # read at all.
      # `node` rather than `jq`, which the Forgejo node image may lack; the
      # schema is `BlockedState` in @sebastian-software/standards.
      - name: "Guard: no blocking agent findings for this PR"
        run: |
          node -e "
          const { existsSync, readFileSync } = require('node:fs');
          const file = '.standards/blocked.json';
          if (!existsSync(file)) { process.exit(0); }
          const raw = readFileSync(file, 'utf8');
          console.log(raw);
          const fail = (detail) => { console.error('Refusing to pass ' + file + ': ' + detail); process.exit(1); };
          let state;
          try { state = JSON.parse(raw); } catch (error) { fail('it is not valid JSON — ' + error.message); }
          if (typeof state !== 'object' || state === null || Array.isArray(state)) { fail('it is not a JSON object.'); }
          const orNull = (value, type) => value === null || typeof value === type;
          const broken = [
            ['schemaVersion must be 1', state.schemaVersion !== 1],
            ['blocking must be a boolean', typeof state.blocking !== 'boolean'],
            ['reason must be a string', typeof state.reason !== 'string'],
            ['detectedAt must be a string', typeof state.detectedAt !== 'string'],
            ['expectedStandardsVersion must be a number', typeof state.expectedStandardsVersion !== 'number'],
            ['observedStandardsVersion must be a number or null', !orNull(state.observedStandardsVersion, 'number')],
            ['expectedCliVersion must be a string or null', !orNull(state.expectedCliVersion, 'string')],
            ['observedCliVersion must be a string or null', !orNull(state.observedCliVersion, 'string')],
            ['failedChecks must be an array of strings', !Array.isArray(state.failedChecks) || !state.failedChecks.every((entry) => typeof entry === 'string')],
            ['retry must be a string', typeof state.retry !== 'string'],
          ].filter((entry) => entry[1]).map((entry) => entry[0]);
          if (broken.length > 0) { fail('it does not match the documented schema — ' + broken.join('; ')); }
          if (state.blocking) { fail('the agent could not validate its result.'); }
          console.log('The agent marker is non-blocking; its findings are reviewer context.');
          "

      # A Rust-only repository has no lockfile to pin the CLI in, so the
      # version is pinned here and Renovate's regex manager moves it (see
      # ../rust/README.md). An unpinned `dlx` would execute whatever was
      # published minutes ago, with the job's token.
      #
      # minimum-release-age=0 stays: pnpm 11 defaults minimumReleaseAge to 1440
      # (24h), so without the bypass a pin that was raised on the day of a
      # standards release cannot resolve at all.
      #
      # The release pin marker is for the standards repository:
      # release-please rewrites the pin below whenever it bumps package.json,
      # so the shipped reference never names a CLI older than its own stamp.
      # In a consumer repository the marker is inert and Renovate owns the pin.
      - run: pnpm --config.minimum-release-age=0 dlx @sebastian-software/standards@0.13.0 check
