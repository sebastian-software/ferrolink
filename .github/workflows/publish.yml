# One product, one release signal: Release Please opens a single release pull
# request; merging it creates the tag and the GitHub Release, and the gated
# publish jobs below run from that tag: the crate to crates.io, and the npm
# package `ferrolink` with one `@ferrolink/<platform>` package per native
# addon. The shape follows the standards publish skeleton
# (reference/release-please/publish-skeleton.yml in sebastian-software/standards).
#
# The manual path exists for retries only: when the publish job failed after
# the release was cut, dispatch the workflow with that release's tag. The job
# checks out `inputs.tag || needs.release-please.outputs.tag_name` — the
# release tag, never `main` — so a delayed retry cannot publish newer sources
# under a version that already exists, and an unknown tag fails the checkout.
#
# Every action is pinned to a full commit SHA with the version in a trailing
# comment. The shared composite action is pinned to the commit of a standards
# release; Renovate moves the pin.

name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)publish, for example ferrolink-v0.1.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-please:
    name: release please
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Events created with the built-in GITHUB_TOKEN do not start new
          # workflow runs. Provide a GitHub App token or PAT when CI has to run
          # on the release PR itself.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  publish-crates:
    name: publish to crates.io
    needs: release-please
    # `!cancelled()` lets the job run when release-please was skipped by the
    # manual path; a plain `needs` would skip it too.
    if: >-
      ${{ !cancelled() && (
        (github.event_name == 'push' && needs.release-please.outputs.releases_created == 'true') ||
        github.event_name == 'workflow_dispatch'
      ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # crates.io Trusted Publishing exchanges this OIDC token for a
      # short-lived registry token. No secret is needed once it is enabled.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch

      - uses: sebastian-software/standards/.github/actions/publish-crates@a840766444dbb0e421f1f1868c48bee315ead769 # v0.13.0
        with:
          crates: ferrolink
          # Trusted Publishing is enabled per crate on crates.io and cannot
          # cover the first-ever publish, because the crate does not exist
          # yet. Until it is enabled, this token carries the publish; delete
          # the input afterwards so a run can never fall back to it silently.
          token: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  native-matrix:
    name: napi platform matrix
    needs: release-please
    if: >-
      ${{ !cancelled() && (
        (github.event_name == 'push' && needs.release-please.outputs.releases_created == 'true') ||
        github.event_name == 'workflow_dispatch'
      ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - id: platforms
        uses: sebastian-software/standards/.github/actions/napi-matrix@a840766444dbb0e421f1f1868c48bee315ead769 # v0.13.0
        with:
          package: ferrolink

  build-native:
    name: build ${{ matrix.id }}
    needs: [release-please, native-matrix]
    if: ${{ !cancelled() && needs.native-matrix.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.native-matrix.outputs.matrix) }}
    defaults:
      run:
        shell: bash
        working-directory: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          targets: ${{ matrix.target }}

      # The musl runners are glibc hosts. `napi build --cross-compile` links
      # musl addons with cargo-zigbuild, which needs Zig.
      - if: ${{ matrix.libc == 'musl' }}
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
      - if: ${{ matrix.libc == 'musl' }}
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-zigbuild

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: node/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: node/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:native --target "$TARGET" $CROSS_COMPILE
        env:
          TARGET: ${{ matrix.target }}
          CROSS_COMPILE: ${{ matrix.libc == 'musl' && '--cross-compile' || '' }}

      # The addon that ships is the one tested, wherever the runner can load it.
      - if: ${{ matrix.native }}
        run: pnpm build:ts && pnpm test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: node/dist/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 1

  publish-npm:
    name: publish to npm
    needs: [release-please, build-native]
    if: ${{ !cancelled() && needs.build-native.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # npm Trusted Publishing and the provenance attestation both use this
      # OIDC token.
      id-token: write
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: node/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: node/pnpm-lock.yaml

      # npm Trusted Publishing needs npm 11.5.1 or newer. Pinned rather than
      # `@latest`, so the tool that performs the publish cannot change under a
      # release.
      - run: npm install --global npm@11.5.1

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:ts

      # Every artifact lands in a directory named after itself:
      # `.native/native-<platform>/ferrolink.<platform>.node`.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: node/.native

      # Writes one `@ferrolink/<platform>` package per napi target, adds them
      # to `ferrolink`'s optional dependencies, and lists what is not on npm
      # yet, platform packages first.
      - id: packages
        run: node scripts/prepare-publish.ts .native

      - if: ${{ steps.packages.outputs.packages != '' }}
        uses: sebastian-software/standards/.github/actions/publish-npm@a840766444dbb0e421f1f1868c48bee315ead769 # v0.13.0
        with:
          working-directory: node
          packages: ${{ steps.packages.outputs.packages }}
          # Trusted Publishing is enabled per package on npmjs.com and cannot
          # cover a package's first publish. Until it is enabled for
          # `ferrolink` and every `@ferrolink/<platform>` package, this token
          # carries the publish; delete the input afterwards.
          token: ${{ secrets.NPM_TOKEN }}
