# One product, one release signal: Release Please opens a single release pull
# request; merging it creates the tag and the GitHub Release, and the gated
# publish job below runs from that tag. The shape follows the standards
# publish skeleton (reference/release-please/publish-skeleton.yml in
# sebastian-software/standards), reduced to the one job this crate needs.
#
# The manual path exists for retries only: when the publish job failed after
# the release was cut, dispatch the workflow with that release's tag. The job
# checks out `inputs.tag || needs.release-please.outputs.tag_name` — the
# release tag, never `main` — so a delayed retry cannot publish newer sources
# under a version that already exists, and an unknown tag fails the checkout.
#
# Every action is pinned to a full commit SHA with the version in a trailing
# comment. The shared composite action is pinned to the commit of a standards
# release; Renovate moves the pin.

name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)publish, for example ferrolink-v0.1.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-please:
    name: release please
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Events created with the built-in GITHUB_TOKEN do not start new
          # workflow runs. Provide a GitHub App token or PAT when CI has to run
          # on the release PR itself.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  publish-crates:
    name: publish to crates.io
    needs: release-please
    # `!cancelled()` lets the job run when release-please was skipped by the
    # manual path; a plain `needs` would skip it too.
    if: >-
      ${{ !cancelled() && (
        (github.event_name == 'push' && needs.release-please.outputs.releases_created == 'true') ||
        github.event_name == 'workflow_dispatch'
      ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # crates.io Trusted Publishing exchanges this OIDC token for a
      # short-lived registry token. No secret is needed once it is enabled.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch

      - uses: sebastian-software/standards/.github/actions/publish-crates@a840766444dbb0e421f1f1868c48bee315ead769 # v0.13.0
        with:
          crates: ferrolink
          # Trusted Publishing is enabled per crate on crates.io and cannot
          # cover the first-ever publish, because the crate does not exist
          # yet. Until it is enabled, this token carries the publish; delete
          # the input afterwards so a run can never fall back to it silently.
          token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
